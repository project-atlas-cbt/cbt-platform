name: DR drill

# B22 (08 §21 "restore drills"; DoD 6, 7, 10): the backup → PITR → verify
# drill, end to end, every week and on demand — and on any pull request
# that changes the drill or the restore tooling, so it cannot rot unseen.
# It builds its own PostgreSQL clusters on the runner (infra/dr/pitr-drill.sh);
# no real database is involved and no secret is needed — the encryption key
# pair is made for the run. RDS backup/PITR itself is drilled on staging (B23).
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/dr/**'
      - 'apps/api/src/ops/restore-*.ts'
      - 'apps/api/src/ops/anonymise-copy*.ts'
      - 'apps/api/src/ops/attempts-affected*.ts'
      - 'packages/db/prisma/migrations/**'
      - '.github/workflows/dr-drill.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '11.27.1'

jobs:
  drill:
    name: Backup, PITR and restore verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PRODUCT_NAME: 'ExamKeep'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      WEB_ORIGIN: 'http://localhost:3000'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
      LOG_LEVEL: 'warn'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET: 'atlas-media-ci'
      S3_ACCESS_KEY_ID: 'atlas_minio_root'
      S3_SECRET_ACCESS_KEY: 'atlas_minio_dev_password'
      S3_REGION: 'us-east-1'
      DRILL_REDIS_URL: 'redis://localhost:6379/7'
      DRILL_PAD_SCALE: '20'
      PGBIN: '/usr/lib/postgresql/16/bin'
    steps:
      - uses: actions/checkout@v7

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER=atlas_minio_root \
            -e MINIO_ROOT_PASSWORD=atlas_minio_dev_password \
            cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break || sleep 1
          done

      - name: PostgreSQL server binaries and age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 age
          sudo systemctl stop postgresql || true

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          DATABASE_URL: 'postgresql://atlas:unused@localhost:5434/atlas_drill?schema=public'
        run: |
          pnpm --filter @atlas/config run build
          pnpm db:generate
          pnpm turbo run build --filter=@atlas/api --filter=@atlas/worker

      - name: Drill
        run: bash infra/dr/pitr-drill.sh

      - name: Upload drill report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dr-drill-report
          path: docs/performance/results/*dr-drill*
          if-no-files-found: ignore
