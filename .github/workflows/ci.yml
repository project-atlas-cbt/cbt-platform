name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# B20: every job gets a read-only token unless it declares more.
permissions:
  contents: read

# B0 scope: "CI pipeline: lint, typecheck, unit, integration against
# ephemeral Postgres, migration check, build." DoD #8: every PR blocks
# merge on failure.
#
# Node is pinned to 24.x here per ADR-0031's baseline even though local
# dev in this environment currently runs 22.18.0 LTS — see that ADR's
# appendix for the recorded deviation and why CI, not the dev machine, is
# the authoritative version-compatibility check.
env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '11.27.1'

jobs:
  lint-typecheck-unit-build:
    name: Lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    env:
      # No database is reachable in this job and none is needed — but four
      # apps/api unit tests import @atlas/db, whose client.ts constructs a
      # PrismaClient at module scope and throws without this. Same reasoning,
      # and the same dummy-value treatment, as the `contract-drift` job below.
      # Nothing here ever opens a connection.
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/db/prisma.config.ts imports @atlas/config, which (like
      # every packages/* workspace package) resolves through its built
      # dist/, not source — must exist before `prisma generate` can even
      # load the config file, let alone before packages/db's own build.
      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      # Generates packages/db/generated/client — a compile-time dependency
      # of apps/api, apps/worker, and the cross-cutting tests, so this must
      # run before lint/typecheck/test, not just before build. `prisma
      # generate` only reads schema.prisma; it never connects to a database.
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  contract-drift:
    name: OpenAPI contract has no uncommitted drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
          POSTGRES_DB: atlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      # Unused for this job (emit only builds the Swagger document, never
      # queries) but @atlas/db's client.ts constructs a PrismaClient at
      # import time and needs a syntactically valid value regardless — see
      # the `integration` job below for where this role's grants actually
      # matter.
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      # B10: unused for this job (emit only builds the Swagger document,
      # never queries) but @atlas/config's env schema requires a
      # syntactically valid value regardless, and openapi:emit boots the
      # whole AppModule (including OperationsModule's PlatformAuditReaderService)
      # to generate it — same reasoning as DATABASE_APP_URL above.
      DATABASE_AUDIT_READER_URL: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      PRODUCT_NAME: 'ExamKeep'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      WEB_ORIGIN: 'http://localhost:3000'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET: 'atlas-media-ci'
      S3_ACCESS_KEY_ID: 'atlas_minio_root'
      S3_SECRET_ACCESS_KEY: 'atlas_minio_dev_password'
      S3_REGION: 'us-east-1'
    steps:
      - uses: actions/checkout@v7

      # MinIO (S3-compatible) storage for OpenAPI generation (AppModule's
      # ObjectStorageService self-provisions the bucket on boot).
      #
      # Image: MinIO withdrew its public images (minio/minio on Docker Hub
      # and quay.io no longer pull), so every job using it failed at this
      # step. Chainguard's build of upstream MinIO, pinned by digest, is the
      # same server and API. It runs as UID 65532 by default and can't
      # write the root-owned /data volume, so this throwaway container runs
      # as root (--user 0). Same image in all three jobs and docker-compose.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER=atlas_minio_root \
            -e MINIO_ROOT_PASSWORD=atlas_minio_dev_password \
            cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break || sleep 1
          done

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # B10: the migration applied below is the first to contain real
      # GRANT/REVOKE statements against atlas_app/atlas_audit_reader (every
      # earlier migration only mentions those role names in comments) — so,
      # same as the "integration" job's own "Bootstrap atlas_app role" step,
      # this job now needs both roles to actually exist first. GitHub
      # Actions `services:` containers can't mount infra/postgres/init.sql
      # the way docker-compose does, so this runs the same SQL by hand.
      - name: Bootstrap atlas_app role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=atlas_ci_password sh scripts/ci/bootstrap-db-roles.sh

      # See the lint-typecheck-unit-build job above for why this must come
      # before db:generate.
      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      # `--filter @atlas/api...` (with the trailing dots) builds @atlas/api AND
      # its workspace dependencies. Every packages/* package resolves through
      # its built dist/ ("main": "./dist/index.js", a deliberate B0 decision),
      # so without them `nest build` cannot resolve @atlas/db or @atlas/domain
      # and fails with a wall of TS2307. The `integration` job never hit this
      # because it runs a full `pnpm build`, where turbo's `dependsOn:
      # ["^build"]` builds dependencies first.
      - name: Build API and contracts
        run: |
          pnpm --filter @atlas/api... build
          pnpm --filter @atlas/contracts build

      - name: Emit OpenAPI document and regenerate contract types
        run: |
          pnpm --filter @atlas/api run openapi:emit
          pnpm --filter @atlas/contracts run generate

      - name: Fail if the committed contract has drifted
        run: |
          git diff --exit-code -- apps/api/openapi.json packages/contracts/src/generated || \
            (echo "::error::OpenAPI contract drift detected — run 'pnpm --filter @atlas/api run openapi:emit && pnpm --filter @atlas/contracts run generate' and commit the result." && exit 1)

  integration:
    name: Integration tests (Postgres + Redis + MinIO)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
          POSTGRES_DB: atlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_URL_TEST: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      # Non-superuser role the running application (and the RLS isolation
      # test) actually connects as — see infra/postgres/init.sql and
      # ADR-0023. GitHub Actions' `services:` containers can't mount a
      # custom docker-entrypoint-initdb.d script the way docker-compose
      # does, so the "Bootstrap atlas_app role" step below runs the same
      # SQL by hand instead.
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_APP_URL_TEST: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      # B10: read-only, single-table (audit_events) role for
      # PlatformAuditReaderService — see infra/postgres/init.sql and the
      # "Bootstrap atlas_app role" step below, extended for this role too.
      DATABASE_AUDIT_READER_URL: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_AUDIT_READER_URL_TEST: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      # B21: the same app role through PgBouncer in transaction mode (the
      # local stand-in for production RDS Proxy), for
      # tests/tenancy/pooler-tenant-isolation.integration.test.ts (ADR-0023).
      DATABASE_APP_POOLED_URL_TEST: 'postgresql://atlas_app:atlas_app_ci_password@localhost:6432/atlas_ci'
      REDIS_URL: 'redis://localhost:6379'
      PRODUCT_NAME: 'ExamKeep'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      WEB_ORIGIN: 'http://localhost:3000'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET: 'atlas-media-ci'
      S3_ACCESS_KEY_ID: 'atlas_minio_root'
      S3_SECRET_ACCESS_KEY: 'atlas_minio_dev_password'
      S3_REGION: 'us-east-1'
      # tests/support/run-prisma.ts's `migrate reset` call — same
      # human-reviewed, repeatable consent as the local dev database (see
      # that file's comment), scoped here to the ephemeral CI database.
      PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: 'Yes, proceed (Recommended)'
    steps:
      - uses: actions/checkout@v7

      # MinIO (S3-compatible) storage for storage integration tests
      # (e.g. media.integration.test.ts) and AppModule boot.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER=atlas_minio_root \
            -e MINIO_ROOT_PASSWORD=atlas_minio_dev_password \
            cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break || sleep 1
          done

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors infra/postgres/init.sql — must run before any migration,
      # since ALTER DEFAULT PRIVILEGES only applies to tables created by
      # "atlas" (the migration owner) after this point.
      - name: Bootstrap atlas_app role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=atlas_ci_password sh scripts/ci/bootstrap-db-roles.sh

      # See the lint-typecheck-unit-build job above for why this must come
      # before db:generate.
      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      # B21: PgBouncer 1.26 in transaction mode — same image (by digest) and
      # pooling settings as infra/load/pgbouncer.ini, pointed at the CI
      # database. A small server pool, so the isolation test reuses
      # server connections across schools many times over.
      - name: Start PgBouncer (transaction pooling)
        run: |
          mkdir -p /tmp/pgbouncer
          cat > /tmp/pgbouncer/pgbouncer.ini <<'INI'
          [databases]
          atlas_ci = host=127.0.0.1 port=5432 dbname=atlas_ci
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = scram-sha-256
          auth_file = /etc/pgbouncer/userlist.txt
          pool_mode = transaction
          default_pool_size = 10
          max_client_conn = 1000
          max_prepared_statements = 200
          ignore_startup_parameters = extra_float_digits,options
          INI
          echo '"atlas_app" "atlas_app_ci_password"' > /tmp/pgbouncer/userlist.txt
          docker run -d --name pgbouncer --network host             -v /tmp/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro             -v /tmp/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro             edoburu/pgbouncer@sha256:9c78945868a6a142c7fc40ccd843bbe5a606df163c7ffce4de70e0d628d696a2
          for _ in $(seq 1 30); do
            PGPASSWORD=atlas_app_ci_password psql -h 127.0.0.1 -p 6432 -U atlas_app -d atlas_ci -tAc 'select 1' >/dev/null 2>&1 && break || sleep 1
          done

      - name: Build
        run: pnpm build

      # The root script runs the api and worker suites one at a time, then
      # the cross-cutting suite last: its migrations test drops and resets
      # this same database (ending empty by design), which wiped the api
      # suite's tables mid-run when turbo ran them in parallel.
      - name: Integration tests
        run: pnpm test:integration

      - name: Technology validation spike (ADR-0031)
        run: pnpm spike

  # B20: the endpoint-wide security suites (tenant isolation across every
  # endpoint, privilege escalation across all six roles, sessions/CSRF,
  # injection, uploads, headers/CORS, rate limits, MFA, log hygiene) — a
  # separate, named merge blocker.
  security:
    name: Security suites (tenant isolation, privilege escalation, attacks)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
          POSTGRES_DB: atlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_URL_TEST: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      # Non-superuser role the running application (and the RLS isolation
      # test) actually connects as — see infra/postgres/init.sql and
      # ADR-0023. GitHub Actions' `services:` containers can't mount a
      # custom docker-entrypoint-initdb.d script the way docker-compose
      # does, so the "Bootstrap atlas_app role" step below runs the same
      # SQL by hand instead.
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_APP_URL_TEST: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      # B10: read-only, single-table (audit_events) role for
      # PlatformAuditReaderService — see infra/postgres/init.sql and the
      # "Bootstrap atlas_app role" step below, extended for this role too.
      DATABASE_AUDIT_READER_URL: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_AUDIT_READER_URL_TEST: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      PRODUCT_NAME: 'ExamKeep'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      WEB_ORIGIN: 'http://localhost:3000'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET: 'atlas-media-ci'
      S3_ACCESS_KEY_ID: 'atlas_minio_root'
      S3_SECRET_ACCESS_KEY: 'atlas_minio_dev_password'
      S3_REGION: 'us-east-1'
      # tests/support/run-prisma.ts's `migrate reset` call — same
      # human-reviewed, repeatable consent as the local dev database (see
      # that file's comment), scoped here to the ephemeral CI database.
      PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: 'Yes, proceed (Recommended)'
    steps:
      - uses: actions/checkout@v7

      # MinIO (S3-compatible) storage for storage integration tests
      # (e.g. media.integration.test.ts) and AppModule boot.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER=atlas_minio_root \
            -e MINIO_ROOT_PASSWORD=atlas_minio_dev_password \
            cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break || sleep 1
          done

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors infra/postgres/init.sql — must run before any migration,
      # since ALTER DEFAULT PRIVILEGES only applies to tables created by
      # "atlas" (the migration owner) after this point.
      - name: Bootstrap atlas_app role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=atlas_ci_password sh scripts/ci/bootstrap-db-roles.sh

      # See the lint-typecheck-unit-build job above for why this must come
      # before db:generate.
      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      - name: Build
        run: pnpm build

      - name: Security suites
        run: pnpm test:security

  # B20 DoD 4: dependency and container scanning, blocking on HIGH/CRITICAL.
  # B21: exam-path performance regressions fail the build. The real API and
  # worker run as processes against the CI service containers; the
  # tools/load harness drives them the way the F13 client does and checks
  # the agreed budgets (docs/performance/capacity-plan.md) plus exact
  # attempt/result counts and the no-lost-answer oracle. Full 500/1,000
  # levels stay manual (docs/performance/load-testing.md) — they need a
  # quiet machine and minutes per level.
  load-smoke:
    name: Load smoke (20/100 attempts, 100-way start and submit bursts)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
          POSTGRES_DB: atlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_AUDIT_READER_URL: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      PRODUCT_NAME: 'ExamKeep'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      WEB_ORIGIN: 'http://localhost:3000'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET: 'atlas-media-ci'
      S3_ACCESS_KEY_ID: 'atlas_minio_root'
      S3_SECRET_ACCESS_KEY: 'atlas_minio_dev_password'
      S3_REGION: 'us-east-1'
      TRUST_PROXY_HOPS: '1'
      LOG_LEVEL: 'warn'
      DATABASE_POOL_MAX: '20'
      MARKING_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@v7

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER=atlas_minio_root \
            -e MINIO_ROOT_PASSWORD=atlas_minio_dev_password \
            cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break || sleep 1
          done

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap atlas_app role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=atlas_ci_password sh scripts/ci/bootstrap-db-roles.sh

      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      - name: Build
        run: pnpm build

      - name: Start API and worker
        run: |
          (cd apps/api && nohup node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/worker && nohup node dist/main.js > /tmp/worker.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3001/v1/health/ready >/dev/null 2>&1 && break || sleep 1
          done
          curl -fsS http://127.0.0.1:3001/v1/health/ready

      - name: Provision load schools
        run: pnpm --filter @atlas/load provision --name ci --schools 2 --students 100 --questions 20

      - name: Sustained levels (20, 100)
        run: pnpm --filter @atlas/load load levels --name ci --levels 20,100 --ramp 30 --sustain 120 --submit-spread 20 --tag ci

      - name: 100-way start burst
        run: pnpm --filter @atlas/load load burst --name ci --kind start --n 100 --tag ci

      - name: 100-way submit burst
        run: pnpm --filter @atlas/load load burst --name ci --kind submit --n 100 --tag ci

      - name: Upload load results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: load-smoke-results
          path: |
            docs/performance/results/*-ci.*
            docs/performance/results/*-ci-*.*
            /tmp/api.log
            /tmp/worker.log
          if-no-files-found: ignore

  # B23 DoD 4–5: the golden-path journey of 09 §39 over HTTP (tools/load
  # golden-path), first on this commit, then across a mixed-version rollout:
  # the base commit's API and worker each running beside this commit's
  # other half, on this commit's migrated schema — what ECS serves while a
  # deployment replaces tasks, and what a rollback leaves running. The
  # expand-only migration rule (scripts/lint-migrations.mjs) is what keeps
  # these legs green; a contract step that breaks the previous release
  # fails here.
  golden-path:
    name: Golden path and mixed-version rollout
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
          POSTGRES_DB: atlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_AUDIT_READER_URL: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      PRODUCT_NAME: 'ExamKeep'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      WEB_ORIGIN: 'http://localhost:3000'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET: 'atlas-media-ci'
      S3_ACCESS_KEY_ID: 'atlas_minio_root'
      S3_SECRET_ACCESS_KEY: 'atlas_minio_dev_password'
      S3_REGION: 'us-east-1'
      LOG_LEVEL: 'warn'
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER=atlas_minio_root \
            -e MINIO_ROOT_PASSWORD=atlas_minio_dev_password \
            cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break || sleep 1
          done

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap atlas_app role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=atlas_ci_password sh scripts/ci/bootstrap-db-roles.sh

      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      - name: Generate Prisma client and apply this commit's migrations
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      - name: Build
        run: pnpm build

      - name: Golden path (this commit)
        run: |
          scripts/ci/run-fleet.sh "$PWD" "$PWD" head
          pnpm --filter @atlas/load golden-path

      # The previous release, built from the base commit with its own
      # Prisma client, never migrating: it runs on this commit's schema.
      - name: Build the base commit
        if: env.BASE_SHA != '' && env.BASE_SHA != '0000000000000000000000000000000000000000'
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add /tmp/base "$BASE_SHA"
          cd /tmp/base
          pnpm install --frozen-lockfile
          pnpm --filter @atlas/config run build
          pnpm db:generate
          pnpm --filter @atlas/api... --filter @atlas/worker... run build

      - name: Golden path (base API, this commit's worker)
        if: env.BASE_SHA != '' && env.BASE_SHA != '0000000000000000000000000000000000000000'
        run: |
          scripts/ci/run-fleet.sh /tmp/base "$PWD" base-api
          pnpm --filter @atlas/load golden-path

      - name: Golden path (this commit's API, base worker)
        if: env.BASE_SHA != '' && env.BASE_SHA != '0000000000000000000000000000000000000000'
        run: |
          scripts/ci/run-fleet.sh "$PWD" /tmp/base base-worker
          pnpm --filter @atlas/load golden-path

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: golden-path-logs
          path: |
            /tmp/*-head.log
            /tmp/*-base-*.log
          if-no-files-found: ignore

  # F20: the web app's browser suites (apps/web/e2e) against production
  # builds of the API and web app — axe accessibility scans of every
  # workspace, a keyboard-only exam, CSP/headers, Software Admin MFA,
  # constrained network and 503 Retry-After, media pre-cache, the low-end
  # CPU profile, and the @matrix smoke in Firefox and WebKit — plus the
  # first-load bundle budgets (exam route the smallest).
  marketing-e2e:
    name: Marketing site browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCT_NAME: 'ExamKeep'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @atlas/marketing build

      - name: Install Playwright browser
        run: pnpm --filter @atlas/marketing exec playwright install --with-deps chromium

      - name: Browser checks
        run: pnpm --filter @atlas/marketing test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: marketing-playwright-report
          path: apps/marketing/playwright-report

  web-e2e:
    name: Web browser suites and bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
          POSTGRES_DB: atlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_AUDIT_READER_URL: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      PRODUCT_NAME: 'ExamKeep'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET: 'atlas-media-ci'
      S3_ACCESS_KEY_ID: 'atlas_minio_root'
      S3_SECRET_ACCESS_KEY: 'atlas_minio_dev_password'
      S3_REGION: 'us-east-1'
      # playwright.config.ts starts the API with these (MinIO defaults to
      # allowing any origin, which the media pre-cache's fetch needs).
      E2E_S3_ENDPOINT: 'http://localhost:9000'
      E2E_S3_BUCKET: 'atlas-media-ci'
      # Inlined into the client bundle at build time: the CSP's media host.
      NEXT_PUBLIC_MEDIA_ORIGIN: 'http://localhost:9000'
    steps:
      - uses: actions/checkout@v7

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER=atlas_minio_root \
            -e MINIO_ROOT_PASSWORD=atlas_minio_dev_password \
            cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break || sleep 1
          done

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap atlas_app role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=atlas_ci_password sh scripts/ci/bootstrap-db-roles.sh

      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_RELEASE_VERSION: e2e-previous

      # F21 (DoD 5–6): e2e/deployment.spec.ts deploys a new build mid-exam.
      # The build above becomes "the previous release"; the web app is then
      # built again as the current one, which every other suite runs on.
      - name: Previous and current web builds
        run: |
          node apps/web/scripts/snapshot-build.mjs .e2e-deploy/previous
          pnpm --filter @atlas/web build
        env:
          NEXT_PUBLIC_RELEASE_VERSION: e2e-current

      - name: Install Playwright browsers
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium firefox webkit

      - name: Bundle budgets
        run: |
          (cd apps/web && nohup pnpm exec next start -p 3000 > /tmp/web-budget.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/manifest.webmanifest >/dev/null 2>&1 && break || sleep 1
          done
          pnpm --filter @atlas/web bundle:budget --base http://localhost:3000
          pkill -f "[n]ext-server|[n]ext start" || true

      - name: Browser suites
        run: pnpm --filter @atlas/web test:e2e
        env:
          E2E_PREVIOUS_WEB_DIR: ../../.e2e-deploy/previous

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  # F21 (owner decision 2026-10-04): the CI stack replaces per-PR preview
  # deployments and staging while the pilot runs on one VPS. The pilot's
  # own Compose stack (infra/vps) is built from this commit and deployed
  # with bin/deploy.sh exactly as on the server: production configuration,
  # TLS everywhere, SMTP over STARTTLS. Then the golden path (09 §39, the
  # staging gate), the post-deploy smoke (inside deploy.sh) and browser
  # checks run against it. Page screenshots are uploaded as the preview.
  pilot-stack:
    name: CI stack (production configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # deploy.sh runs git as root (it prepares the internal CA as root).
      - name: Allow git as root on this checkout
        run: sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and deploy the stack
        run: sudo -E infra/vps/ci/stack.sh up

      - name: Golden path against the stack
        run: sudo -E infra/vps/ci/stack.sh golden

      - name: Install dependencies (browser checks)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and trust the stack's CA
        run: |
          pnpm --filter @atlas/web exec playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          sudo cat infra/vps/certs/ca.crt > /tmp/atlas-ci-ca.crt
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n atlas-ci -i /tmp/atlas-ci-ca.crt

      - name: Browser checks against the stack
        run: pnpm --filter @atlas/web exec playwright test -c playwright.stack.config.ts

      - name: Upload page preview
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stack-preview
          path: |
            apps/web/stack-preview
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

      - name: Stack logs
        if: failure()
        run: sudo -E infra/vps/ci/stack.sh logs

      - name: Tear down
        if: always()
        run: sudo -E infra/vps/ci/stack.sh down

  supply-chain:
    name: Dependency and container scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production dependency tree, HIGH and above. Remediation is an upgrade
      # or a pnpm-workspace.yaml override (see the B20 block there); an
      # accepted finding is recorded in docs/security/threat-model.md.
      - name: pnpm audit (production, high+)
        run: pnpm audit:deps

      # Pinned by commit SHA, not tag: this action's tags were rewritten by
      # an attacker in 2026, and its tags are v-prefixed (the earlier
      # `@0.33.1` never resolved). Dependabot keeps the SHA current.
      - name: Trivy filesystem scan (dependencies, secrets, IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: '**/node_modules,apps/web/.next'

      # The hosted runner starts with most of its disk taken by preinstalled
      # toolchains this job never uses; building the image and saving it as
      # a tarball ran out of space (2026-10-02). Removing them frees ~20 GB.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      # Scanned from a `docker save` tarball, not through the daemon: with the
      # runners' containerd image store, Trivy fails reading layers from the
      # daemon ("unable to get uncompressed layer"). The tarball is the same
      # image, read directly.
      - name: Build container image
        run: |
          docker build -f infra/docker/Dockerfile.node -t atlas-node:ci .
          docker save atlas-node:ci -o "$RUNNER_TEMP/atlas-node.tar"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/atlas-node.tar
          # The whole-repo dev image (full node_modules) can outrun Trivy's
          # 5-minute default analysis timeout.
          timeout: 15m
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # B23: the production image (api + worker, production dependencies
      # only) inherits the same gate. The dev image's tarball is removed
      # first so both never sit on the runner's disk at once.
      - name: Build production server image
        run: |
          rm -f "$RUNNER_TEMP/atlas-node.tar"
          docker image rm atlas-node:ci >/dev/null
          docker build -f infra/docker/Dockerfile.prod --target server -t atlas-server:ci .
          docker save atlas-server:ci -o "$RUNNER_TEMP/atlas-server.tar"

      - name: Trivy production image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/atlas-server.tar
          timeout: 15m
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # B20: a detected secret fails the build (it was advisory-only).
      # The gitleaks CLI, not gitleaks-action: the action requires a paid
      # GITLEAKS_LICENSE for organisation-owned repositories and failed
      # before scanning anything. The CLI is the same scanner (MIT), pinned
      # by digest; it reads .gitleaksignore from the repository root and
      # scans the full history (fetch-depth: 0 above).
      - name: Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --redact --no-banner --exit-code 1
