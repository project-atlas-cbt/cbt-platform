name: CI

on:
  pull_request:
  push:
    branches: [main]

# B0 scope: "CI pipeline: lint, typecheck, unit, integration against
# ephemeral Postgres, migration check, build." DoD #8: every PR blocks
# merge on failure.
#
# Node is pinned to 24.x here per ADR-0031's baseline even though local
# dev in this environment currently runs 22.18.0 LTS — see that ADR's
# appendix for the recorded deviation and why CI, not the dev machine, is
# the authoritative version-compatibility check.
env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '11.23.0'

jobs:
  lint-typecheck-unit-build:
    name: Lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/db/prisma.config.ts imports @atlas/config, which (like
      # every packages/* workspace package) resolves through its built
      # dist/, not source — must exist before `prisma generate` can even
      # load the config file, let alone before packages/db's own build.
      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      # Generates packages/db/generated/client — a compile-time dependency
      # of apps/api, apps/worker, and the cross-cutting tests, so this must
      # run before lint/typecheck/test, not just before build. `prisma
      # generate` only reads schema.prisma; it never connects to a database.
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  contract-drift:
    name: OpenAPI contract has no uncommitted drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
          POSTGRES_DB: atlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      # Unused for this job (emit only builds the Swagger document, never
      # queries) but @atlas/db's client.ts constructs a PrismaClient at
      # import time and needs a syntactically valid value regardless — see
      # the `integration` job below for where this role's grants actually
      # matter.
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      # B10: unused for this job (emit only builds the Swagger document,
      # never queries) but @atlas/config's env schema requires a
      # syntactically valid value regardless, and openapi:emit boots the
      # whole AppModule (including OperationsModule's PlatformAuditReaderService)
      # to generate it — same reasoning as DATABASE_APP_URL above.
      DATABASE_AUDIT_READER_URL: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      PRODUCT_NAME: 'Project Atlas'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      WEB_ORIGIN: 'http://localhost:3000'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # B10: the migration applied below is the first to contain real
      # GRANT/REVOKE statements against atlas_app/atlas_audit_reader (every
      # earlier migration only mentions those role names in comments) — so,
      # same as the "integration" job's own "Bootstrap atlas_app role" step,
      # this job now needs both roles to actually exist first. GitHub
      # Actions `services:` containers can't mount infra/postgres/init.sql
      # the way docker-compose does, so this runs the same SQL by hand.
      - name: Bootstrap atlas_app role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=atlas_ci_password psql -h localhost -U atlas -d atlas_ci -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE atlas_app WITH LOGIN PASSWORD 'atlas_app_ci_password'" \
            -c "GRANT USAGE ON SCHEMA public TO atlas_app" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE atlas IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO atlas_app" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE atlas IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO atlas_app" \
            -c "CREATE ROLE atlas_audit_reader WITH LOGIN PASSWORD 'atlas_audit_reader_ci_password'" \
            -c "GRANT USAGE ON SCHEMA public TO atlas_audit_reader"

      # See the lint-typecheck-unit-build job above for why this must come
      # before db:generate.
      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      # `--filter @atlas/api...` (with the trailing dots) builds @atlas/api AND
      # its workspace dependencies. Every packages/* package resolves through
      # its built dist/ ("main": "./dist/index.js", a deliberate B0 decision),
      # so without them `nest build` cannot resolve @atlas/db or @atlas/domain
      # and fails with a wall of TS2307. The `integration` job never hit this
      # because it runs a full `pnpm build`, where turbo's `dependsOn:
      # ["^build"]` builds dependencies first.
      - name: Build API and contracts
        run: |
          pnpm --filter @atlas/api... build
          pnpm --filter @atlas/contracts build --if-present

      - name: Emit OpenAPI document and regenerate contract types
        run: |
          pnpm --filter @atlas/api run openapi:emit
          pnpm --filter @atlas/contracts run generate

      - name: Fail if the committed contract has drifted
        run: |
          git diff --exit-code -- apps/api/openapi.json packages/contracts/src/generated || \
            (echo "::error::OpenAPI contract drift detected — run 'pnpm --filter @atlas/api run openapi:emit && pnpm --filter @atlas/contracts run generate' and commit the result." && exit 1)

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
          POSTGRES_DB: atlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_URL_TEST: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      # Non-superuser role the running application (and the RLS isolation
      # test) actually connects as — see infra/postgres/init.sql and
      # ADR-0023. GitHub Actions' `services:` containers can't mount a
      # custom docker-entrypoint-initdb.d script the way docker-compose
      # does, so the "Bootstrap atlas_app role" step below runs the same
      # SQL by hand instead.
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_APP_URL_TEST: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      # B10: read-only, single-table (audit_events) role for
      # PlatformAuditReaderService — see infra/postgres/init.sql and the
      # "Bootstrap atlas_app role" step below, extended for this role too.
      DATABASE_AUDIT_READER_URL: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_AUDIT_READER_URL_TEST: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      PRODUCT_NAME: 'Project Atlas'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      WEB_ORIGIN: 'http://localhost:3000'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
      # tests/support/run-prisma.ts's `migrate reset` call — same
      # human-reviewed, repeatable consent as the local dev database (see
      # that file's comment), scoped here to the ephemeral CI database.
      PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: 'Yes, proceed (Recommended)'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors infra/postgres/init.sql — must run before any migration,
      # since ALTER DEFAULT PRIVILEGES only applies to tables created by
      # "atlas" (the migration owner) after this point.
      - name: Bootstrap atlas_app role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=atlas_ci_password psql -h localhost -U atlas -d atlas_ci -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE atlas_app WITH LOGIN PASSWORD 'atlas_app_ci_password'" \
            -c "GRANT USAGE ON SCHEMA public TO atlas_app" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE atlas IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO atlas_app" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE atlas IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO atlas_app" \
            -c "CREATE ROLE atlas_audit_reader WITH LOGIN PASSWORD 'atlas_audit_reader_ci_password'" \
            -c "GRANT USAGE ON SCHEMA public TO atlas_audit_reader"

      # See the lint-typecheck-unit-build job above for why this must come
      # before db:generate.
      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      - name: Build
        run: pnpm build

      - name: Integration tests
        run: pnpm test:integration

      - name: Technology validation spike (ADR-0031)
        run: pnpm spike

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
