name: CI

on:
  pull_request:
  push:
    branches: [main]

# B20: every job gets a read-only token unless it declares more.
permissions:
  contents: read

# B0 scope: "CI pipeline: lint, typecheck, unit, integration against
# ephemeral Postgres, migration check, build." DoD #8: every PR blocks
# merge on failure.
#
# Node is pinned to 24.x here per ADR-0031's baseline even though local
# dev in this environment currently runs 22.18.0 LTS — see that ADR's
# appendix for the recorded deviation and why CI, not the dev machine, is
# the authoritative version-compatibility check.
env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '11.23.0'

jobs:
  lint-typecheck-unit-build:
    name: Lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    env:
      # No database is reachable in this job and none is needed — but four
      # apps/api unit tests import @atlas/db, whose client.ts constructs a
      # PrismaClient at module scope and throws without this. Same reasoning,
      # and the same dummy-value treatment, as the `contract-drift` job below.
      # Nothing here ever opens a connection.
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/db/prisma.config.ts imports @atlas/config, which (like
      # every packages/* workspace package) resolves through its built
      # dist/, not source — must exist before `prisma generate` can even
      # load the config file, let alone before packages/db's own build.
      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      # Generates packages/db/generated/client — a compile-time dependency
      # of apps/api, apps/worker, and the cross-cutting tests, so this must
      # run before lint/typecheck/test, not just before build. `prisma
      # generate` only reads schema.prisma; it never connects to a database.
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  contract-drift:
    name: OpenAPI contract has no uncommitted drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
          POSTGRES_DB: atlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      # Unused for this job (emit only builds the Swagger document, never
      # queries) but @atlas/db's client.ts constructs a PrismaClient at
      # import time and needs a syntactically valid value regardless — see
      # the `integration` job below for where this role's grants actually
      # matter.
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      # B10: unused for this job (emit only builds the Swagger document,
      # never queries) but @atlas/config's env schema requires a
      # syntactically valid value regardless, and openapi:emit boots the
      # whole AppModule (including OperationsModule's PlatformAuditReaderService)
      # to generate it — same reasoning as DATABASE_APP_URL above.
      DATABASE_AUDIT_READER_URL: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      PRODUCT_NAME: 'Project Atlas'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      WEB_ORIGIN: 'http://localhost:3000'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET: 'atlas-media-ci'
      S3_ACCESS_KEY_ID: 'atlas_minio_root'
      S3_SECRET_ACCESS_KEY: 'atlas_minio_dev_password'
      S3_REGION: 'us-east-1'
    steps:
      - uses: actions/checkout@v4

      # MinIO (S3-compatible) storage for OpenAPI generation (AppModule's
      # ObjectStorageService self-provisions the bucket on boot).
      #
      # Image: MinIO withdrew its public images (minio/minio on Docker Hub
      # and quay.io no longer pull), so every job using it failed at this
      # step. Chainguard's build of upstream MinIO, pinned by digest, is the
      # same server and API. It runs as UID 65532 by default and can't
      # write the root-owned /data volume, so this throwaway container runs
      # as root (--user 0). Same image in all three jobs and docker-compose.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER=atlas_minio_root \
            -e MINIO_ROOT_PASSWORD=atlas_minio_dev_password \
            cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break || sleep 1
          done

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # B10: the migration applied below is the first to contain real
      # GRANT/REVOKE statements against atlas_app/atlas_audit_reader (every
      # earlier migration only mentions those role names in comments) — so,
      # same as the "integration" job's own "Bootstrap atlas_app role" step,
      # this job now needs both roles to actually exist first. GitHub
      # Actions `services:` containers can't mount infra/postgres/init.sql
      # the way docker-compose does, so this runs the same SQL by hand.
      - name: Bootstrap atlas_app role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=atlas_ci_password sh scripts/ci/bootstrap-db-roles.sh

      # See the lint-typecheck-unit-build job above for why this must come
      # before db:generate.
      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      # `--filter @atlas/api...` (with the trailing dots) builds @atlas/api AND
      # its workspace dependencies. Every packages/* package resolves through
      # its built dist/ ("main": "./dist/index.js", a deliberate B0 decision),
      # so without them `nest build` cannot resolve @atlas/db or @atlas/domain
      # and fails with a wall of TS2307. The `integration` job never hit this
      # because it runs a full `pnpm build`, where turbo's `dependsOn:
      # ["^build"]` builds dependencies first.
      - name: Build API and contracts
        run: |
          pnpm --filter @atlas/api... build
          pnpm --filter @atlas/contracts build

      - name: Emit OpenAPI document and regenerate contract types
        run: |
          pnpm --filter @atlas/api run openapi:emit
          pnpm --filter @atlas/contracts run generate

      - name: Fail if the committed contract has drifted
        run: |
          git diff --exit-code -- apps/api/openapi.json packages/contracts/src/generated || \
            (echo "::error::OpenAPI contract drift detected — run 'pnpm --filter @atlas/api run openapi:emit && pnpm --filter @atlas/contracts run generate' and commit the result." && exit 1)

  integration:
    name: Integration tests (Postgres + Redis + MinIO)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
          POSTGRES_DB: atlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_URL_TEST: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      # Non-superuser role the running application (and the RLS isolation
      # test) actually connects as — see infra/postgres/init.sql and
      # ADR-0023. GitHub Actions' `services:` containers can't mount a
      # custom docker-entrypoint-initdb.d script the way docker-compose
      # does, so the "Bootstrap atlas_app role" step below runs the same
      # SQL by hand instead.
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_APP_URL_TEST: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      # B10: read-only, single-table (audit_events) role for
      # PlatformAuditReaderService — see infra/postgres/init.sql and the
      # "Bootstrap atlas_app role" step below, extended for this role too.
      DATABASE_AUDIT_READER_URL: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_AUDIT_READER_URL_TEST: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      PRODUCT_NAME: 'Project Atlas'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      WEB_ORIGIN: 'http://localhost:3000'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET: 'atlas-media-ci'
      S3_ACCESS_KEY_ID: 'atlas_minio_root'
      S3_SECRET_ACCESS_KEY: 'atlas_minio_dev_password'
      S3_REGION: 'us-east-1'
      # tests/support/run-prisma.ts's `migrate reset` call — same
      # human-reviewed, repeatable consent as the local dev database (see
      # that file's comment), scoped here to the ephemeral CI database.
      PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: 'Yes, proceed (Recommended)'
    steps:
      - uses: actions/checkout@v4

      # MinIO (S3-compatible) storage for storage integration tests
      # (e.g. media.integration.test.ts) and AppModule boot.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER=atlas_minio_root \
            -e MINIO_ROOT_PASSWORD=atlas_minio_dev_password \
            cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break || sleep 1
          done

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors infra/postgres/init.sql — must run before any migration,
      # since ALTER DEFAULT PRIVILEGES only applies to tables created by
      # "atlas" (the migration owner) after this point.
      - name: Bootstrap atlas_app role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=atlas_ci_password sh scripts/ci/bootstrap-db-roles.sh

      # See the lint-typecheck-unit-build job above for why this must come
      # before db:generate.
      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      - name: Build
        run: pnpm build

      - name: Integration tests
        run: pnpm test:integration

      - name: Technology validation spike (ADR-0031)
        run: pnpm spike

  # B20: the endpoint-wide security suites (tenant isolation across every
  # endpoint, privilege escalation across all six roles, sessions/CSRF,
  # injection, uploads, headers/CORS, rate limits, MFA, log hygiene) — a
  # separate, named merge blocker.
  security:
    name: Security suites (tenant isolation, privilege escalation, attacks)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_password
          POSTGRES_DB: atlas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_URL_TEST: 'postgresql://atlas:atlas_ci_password@localhost:5432/atlas_ci?schema=public'
      # Non-superuser role the running application (and the RLS isolation
      # test) actually connects as — see infra/postgres/init.sql and
      # ADR-0023. GitHub Actions' `services:` containers can't mount a
      # custom docker-entrypoint-initdb.d script the way docker-compose
      # does, so the "Bootstrap atlas_app role" step below runs the same
      # SQL by hand instead.
      DATABASE_APP_URL: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_APP_URL_TEST: 'postgresql://atlas_app:atlas_app_ci_password@localhost:5432/atlas_ci?schema=public'
      # B10: read-only, single-table (audit_events) role for
      # PlatformAuditReaderService — see infra/postgres/init.sql and the
      # "Bootstrap atlas_app role" step below, extended for this role too.
      DATABASE_AUDIT_READER_URL: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      DATABASE_AUDIT_READER_URL_TEST: 'postgresql://atlas_audit_reader:atlas_audit_reader_ci_password@localhost:5432/atlas_ci?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      PRODUCT_NAME: 'Project Atlas'
      SESSION_COOKIE_SECRET: 'ci-only-secret-ci-only-secret-32'
      WEB_ORIGIN: 'http://localhost:3000'
      PLATFORM_ROOT_DOMAIN: 'localtest.me'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET: 'atlas-media-ci'
      S3_ACCESS_KEY_ID: 'atlas_minio_root'
      S3_SECRET_ACCESS_KEY: 'atlas_minio_dev_password'
      S3_REGION: 'us-east-1'
      # tests/support/run-prisma.ts's `migrate reset` call — same
      # human-reviewed, repeatable consent as the local dev database (see
      # that file's comment), scoped here to the ephemeral CI database.
      PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: 'Yes, proceed (Recommended)'
    steps:
      - uses: actions/checkout@v4

      # MinIO (S3-compatible) storage for storage integration tests
      # (e.g. media.integration.test.ts) and AppModule boot.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 --user 0 \
            -e MINIO_ROOT_USER=atlas_minio_root \
            -e MINIO_ROOT_PASSWORD=atlas_minio_dev_password \
            cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break || sleep 1
          done

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors infra/postgres/init.sql — must run before any migration,
      # since ALTER DEFAULT PRIVILEGES only applies to tables created by
      # "atlas" (the migration owner) after this point.
      - name: Bootstrap atlas_app role
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=atlas_ci_password sh scripts/ci/bootstrap-db-roles.sh

      # See the lint-typecheck-unit-build job above for why this must come
      # before db:generate.
      - name: Build @atlas/config
        run: pnpm --filter @atlas/config run build

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      - name: Build
        run: pnpm build

      - name: Security suites
        run: pnpm test:security

  # B20 DoD 4: dependency and container scanning, blocking on HIGH/CRITICAL.
  supply-chain:
    name: Dependency and container scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production dependency tree, HIGH and above. Remediation is an upgrade
      # or a pnpm-workspace.yaml override (see the B20 block there); an
      # accepted finding is recorded in docs/security/threat-model.md.
      - name: pnpm audit (production, high+)
        run: pnpm audit:deps

      # Pinned by commit SHA, not tag: this action's tags were rewritten by
      # an attacker in 2026, and its tags are v-prefixed (the earlier
      # `@0.33.1` never resolved). Dependabot keeps the SHA current.
      - name: Trivy filesystem scan (dependencies, secrets, IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: '**/node_modules,apps/web/.next'

      - name: Build container image
        run: docker build -f infra/docker/Dockerfile.node -t atlas-node:ci .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: atlas-node:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # B20: a detected secret fails the build (it was advisory-only).
      # The gitleaks CLI, not gitleaks-action: the action requires a paid
      # GITLEAKS_LICENSE for organisation-owned repositories and failed
      # before scanning anything. The CLI is the same scanner (MIT), pinned
      # by digest; it reads .gitleaksignore from the repository root and
      # scans the full history (fetch-depth: 0 above).
      - name: Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --redact --no-banner --exit-code 1
