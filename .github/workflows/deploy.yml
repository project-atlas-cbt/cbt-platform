name: Deploy

# B23 (owner decision 2026-10-04): every merge to dev deploys to staging;
# a version tag deploys to production after the `production` environment's
# required reviewer approves. Both run the same procedure
# (deploy-release.yml). Rollback: rollback.yml.
#
# Paused for the VPS pilot (ADR-0032 amendment, 2026-10-04): there are no AWS
# accounts yet, so a run on every merge could only fail. Run it by hand from
# the Actions tab (on a branch for staging, on a v* tag for production), and
# restore these push triggers when the AWS design is provisioned:
#   push: { branches: [dev], tags: ['v*'] }

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/deploy-release.yml
    with:
      environment: staging
      image_tag: ${{ github.sha }}

  production:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/deploy-release.yml
    with:
      environment: production
      image_tag: ${{ github.ref_name }}
