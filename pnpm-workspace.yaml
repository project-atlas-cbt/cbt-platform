packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests'
  # B21: the load/capacity harness — drives a running API, never shipped.
  - 'tools/*'
  # B23: production infrastructure as code (AWS CDK) — synthesised and
  # unit-tested in CI, deployed by .github/workflows/deploy.yml.
  - 'infra/cdk'
overrides:
  # @nestjs/platform-fastify@11.2.1 pins an exact fastify version; without
  # forcing the whole tree to the same one, our own direct `fastify`
  # dependency (needed for FastifyRequest/FastifyReply types) resolves to a
  # second copy, and @fastify/helmet + @fastify/cors's plugin types stop
  # structurally matching the app instance's type. One version, tree-wide.
  fastify: '5.12.5'
  # B20 dependency remediation (pnpm audit --prod --audit-level high, the CI
  # gate): transitive packages whose parents pin a vulnerable version. Each
  # override moves only to the patched release of the same major.
  'fast-uri@<3.1.7': '^3.1.7'
  'fast-uri@>=4 <4.1.4': '^4.1.4'
  'brace-expansion@<1.1.20': '^1.1.20'
  'brace-expansion@>=2 <2.1.6': '^2.1.6'
  'brace-expansion@>=5 <5.0.11': '^5.0.11'
  'browserslist@<4.28.7': '^4.28.7'
  'sharp@<0.35.4': '^0.35.4'
  # Prisma CLI tooling only (studio / non-Postgres adapters) — never on the
  # application's runtime path (it uses @prisma/adapter-pg); Prisma 7.10
  # still pins these. Verified by prisma generate + migrate in CI.
  'mysql2@<3.22.0': '^3.22.0'
  'deepmerge-ts@<8.0.0': '^8.0.0'
  # Dev/test tooling only (Nest CLI and openapi-typescript → js-yaml; jsdom
  # → undici). Outside the --prod gate, but installed in the CI image that
  # Trivy scans, so remediated the same way (2026-10-02 CI repair).
  'js-yaml@>=4 <4.3.2': '^4.3.2'
  'undici@>=8 <8.10.2': '^8.10.2'
allowBuilds:
  # Prisma's own engine binaries — required for `prisma generate`/`migrate`
  # to work at all.
  '@prisma/engines': true
  prisma: true
  # Prisma's postinstall analytics ping (github.com/prisma/prisma/issues,
  # "checkpoint" telemetry) — declined; not required for functionality.
  '@scarf/scarf': false
  # Native binary builds needed by tools already chosen deliberately
  # (Prisma's config loader, ESLint's import resolution, ioredis/bullmq's
  # msgpack perf path).
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
  # Our own git-hooks tool (package.json "simple-git-hooks" config).
  simple-git-hooks: true
minimumReleaseAgeExclude:
  - eslint@10.9.1
  - '@typescript-eslint/eslint-plugin@8.68.0'
  - '@typescript-eslint/parser@8.68.0'
  - '@typescript-eslint/project-service@8.68.0'
  - '@typescript-eslint/scope-manager@8.68.0'
  - '@typescript-eslint/tsconfig-utils@8.68.0'
  - '@typescript-eslint/type-utils@8.68.0'
  - '@typescript-eslint/types@8.68.0'
  - '@typescript-eslint/typescript-estree@8.68.0'
  - '@typescript-eslint/utils@8.68.0'
  - '@typescript-eslint/visitor-keys@8.68.0'
  - typescript-eslint@8.68.0
patchedDependencies:
  sonner@2.0.8: patches/sonner@2.0.8.patch
