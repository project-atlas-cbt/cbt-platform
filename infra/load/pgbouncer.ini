; B21 — local stand-in for production RDS Proxy (project-owner decision,
; 2026-10-02). Transaction pooling: a server connection is held only for the
; duration of one transaction, which is exactly how RDS Proxy multiplexes.
; Tenant context is safe here because withTenant() sets it with
; set_config(..., true) — transaction-local — and every tenant query runs
; inside that same transaction (ADR-0023). Proven by
; tests/tenancy/pooler-tenant-isolation.integration.test.ts.
[databases]
atlas_dev = host=postgres port=5432 dbname=atlas_dev
atlas_test = host=postgres port=5432 dbname=atlas_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; Server connections per (database, user). Sized in
; docs/performance/capacity-plan.md: ~2× the Postgres cores is the
; throughput knee; client connections beyond this queue in PgBouncer, not
; in Postgres.
default_pool_size = 40
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 4000
max_db_connections = 60
; node-postgres (Prisma's adapter) uses the extended protocol; PgBouncer
; >= 1.21 tracks prepared statements per server connection in transaction mode.
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits,options
server_idle_timeout = 60
query_wait_timeout = 30
stats_users = atlas
admin_users = atlas
log_connections = 0
log_disconnections = 0
