# Local development infrastructure only. Production provisioning is deferred
# to B23 (backend-roadmap.md B0 "Deferred items").
name: atlas-dev

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: atlas_dev
    ports:
      - '5432:5432'
    volumes:
      # postgres:18+ images store data in a version-specific subdirectory
      # under /var/lib/postgresql (pg_ctlcluster-compatible layout) — the
      # mount point is the parent directory, not /var/lib/postgresql/data.
      # See https://github.com/docker-library/postgres/pull/1259.
      - atlas_postgres_data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - atlas_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # B4: S3-compatible object storage for local dev/CI. Buckets are private
  # by default with no policy attached — that default-deny behaviour is
  # exactly what proves DoD item 4 ("direct public access denied at the
  # bucket level") against a real backend rather than a mock. The running
  # api/worker never provision the bucket via this compose file — they
  # create it themselves at boot (ObjectStorageService.ensureBucket),
  # idempotently, the same mechanism that has to work in CI service
  # containers, which (per B0's own precedent) can't run custom init
  # scripts the way this file's own postgres service does.
  # MinIO withdrew its public images (minio/minio no longer pulls), so this
  # is Chainguard's build of upstream MinIO, pinned by digest, as in CI. It
  # defaults to UID 65532, which can't write the root-owned data volume.
  minio:
    image: cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b
    user: '0'
    container_name: atlas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atlas_minio_root
      MINIO_ROOT_PASSWORD: atlas_minio_dev_password
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    volumes:
      - atlas_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: atlas-api
    # Applies migrations before starting — `prisma migrate deploy` takes a
    # database-level advisory lock internally, so this is safe to run
    # concurrently with worker's identical step below without a race.
    command: sh -c "pnpm db:migrate:deploy && pnpm --filter @atlas/api run start"
    env_file: .env
    environment:
      # Container-to-container hostnames, overriding .env's localhost
      # values (which are correct for running api/worker natively on the
      # host instead — see README.md's two supported dev workflows).
      DATABASE_URL: postgresql://atlas:atlas_dev_password@postgres:5432/atlas_dev?schema=public
      DATABASE_APP_URL: postgresql://atlas_app:atlas_app_dev_password@postgres:5432/atlas_dev?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      S3_ENDPOINT: http://minio:9000
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: atlas-worker
    command: sh -c "pnpm db:migrate:deploy && pnpm --filter @atlas/worker run start"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://atlas:atlas_dev_password@postgres:5432/atlas_dev?schema=public
      DATABASE_APP_URL: postgresql://atlas_app:atlas_app_dev_password@postgres:5432/atlas_dev?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  atlas_postgres_data:
  atlas_redis_data:
  atlas_minio_data:
